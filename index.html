<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Townshop | Seleccionar landing</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #17211b;
			--muted: #69756c;
			--paper: #f4f1e9;
			--card: #fffdf8;
			--line: #ddd9cd;
			--accent: #d95d39;
			--accent-dark: #a83e25;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 32px 20px;
			color: var(--ink);
			background:
				radial-gradient(circle at 15% 15%, rgba(217, 93, 57, .16), transparent 28%),
				radial-gradient(circle at 85% 85%, rgba(94, 129, 103, .18), transparent 31%),
				var(--paper);
			font-family: Georgia, 'Times New Roman', serif;
		}

		main { width: min(960px, 100%); }

		header { margin-bottom: 34px; }

		.eyebrow {
			margin: 0 0 10px;
			color: var(--accent-dark);
			font: 700 12px/1.2 Arial, sans-serif;
			letter-spacing: .16em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 560px;
			margin: 0;
			font-size: clamp(2.5rem, 7vw, 5.5rem);
			line-height: .94;
			letter-spacing: -.045em;
		}

		.intro {
			max-width: 500px;
			margin: 18px 0 0;
			color: var(--muted);
			font: 16px/1.6 Arial, sans-serif;
		}

		.landing-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 14px;
		}

		.landing-link {
			display: block;
			padding: 18px;
			color: var(--ink);
			text-decoration: none;
		}

		.landing-card {
			overflow: hidden;
			background: var(--card);
			border: 1px solid var(--line);
			transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
		}

		.landing-card:hover,
		.landing-card:has(.landing-link:focus-visible) {
			border-color: var(--accent);
			box-shadow: 0 14px 30px rgba(23, 33, 27, .1);
			transform: translateY(-4px);
		}

		.preview {
			display: block;
			width: 100%;
			height: 190px;
			border: 0;
			background: #eeeae0;
			pointer-events: none;
		}

		.landing-link::after {
			content: '↗';
			float: right;
			color: var(--accent);
			font: 28px/1 Arial, sans-serif;
		}

		.landing-link:focus-visible {
			outline: 3px solid rgba(217, 93, 57, .35);
			outline-offset: 3px;
		}

		.number {
			color: var(--accent);
			font: 700 13px/1 Arial, sans-serif;
			letter-spacing: .12em;
		}

		h2 {
			margin: 18px 0 0;
			font-size: clamp(1.7rem, 4vw, 2.4rem);
			line-height: 1;
		}

		@media (max-width: 600px) {
			body { padding: 24px 16px; }
			header { margin-bottom: 24px; }
			.landing-grid { grid-template-columns: 1fr; }
			.preview { height: 220px; }
		}
	</style>
</head>
<body>
	<main>
		<header>
			<p class="eyebrow">Townshop / explorador</p>
			<h1>Elegí una landing para continuar.</h1>
			<p class="intro">Accedé rápidamente a las distintas versiones de la página de inicio.</p>
		</header>

		<nav class="landing-grid" aria-label="Versiones de landing">
			<article class="landing-card">
				<iframe class="preview" src="landing1/index.html" title="Preview de Landing 1" loading="lazy"></iframe>
				<a class="landing-link" href="landing1/index.html">
					<span class="number">01</span>
					<h2>Landing 1</h2>
				</a>
			</article>
			<article class="landing-card">
				<iframe class="preview" src="landing2/index.html" title="Preview de Landing 2" loading="lazy"></iframe>
				<a class="landing-link" href="landing2/index.html">
					<span class="number">02</span>
					<h2>Landing 2</h2>
				</a>
			</article>
			<article class="landing-card">
				<iframe class="preview" src="landing3/index.html" title="Preview de Landing 3" loading="lazy"></iframe>
				<a class="landing-link" href="landing3/index.html">
					<span class="number">03</span>
					<h2>Landing 3</h2>
				</a>
			</article>
			<article class="landing-card">
				<iframe class="preview" src="landing4/index.html" title="Preview de Landing 4" loading="lazy"></iframe>
				<a class="landing-link" href="landing4/index.html">
					<span class="number">04</span>
					<h2>Landing 4</h2>
				</a>
			</article>
		</nav>
	</main>
</body>
</html>
