<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado del Barrio - Catálogo Dinámico</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <nav class="navbar">
        <h2>🛒 Almacén Gourmet</h2>
        <button class="cart-btn" id="btn-abrir-carrito">
            🛒 Mi Pedido <span class="cart-badge" id="cart-count">0</span>
        </button>
    </nav>

    <header class="hero">
        <h1>Lo mejor del barrio, a tu puerta.</h1>
        <p>Armá tu pedido y te lo enviamos en minutos.</p>
    </header>

    <div class="container">
        <div class="filtros" id="filtros-container">
            <button class="btn-filtro activo" data-cat="todos">Todos</button>
            <button class="btn-filtro" data-cat="panaderia">Panadería</button>
            <button class="btn-filtro" data-cat="frescos">Frescos y Quesos</button>
            <button class="btn-filtro" data-cat="sintacc">Sin TACC</button>
        </div>

        <!-- Contenedor inyectado por JS -->
        <div class="catalogo" id="catalogo-productos">
            <p style="text-align: center; width: 100%; color: gray; padding: 40px 0;">Conectando con la base de datos...</p>
        </div>
    </div>

    <!-- Menú Lateral Carrito -->
    <div class="overlay" id="overlay"></div>
    <div class="cart-modal" id="cart-modal">
        <div class="cart-header">
            <h3>Tu Pedido</h3>
            <button class="close-cart" id="btn-cerrar-carrito">✖</button>
        </div>
        
        <div style="padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; gap: 15px;">
            <label><input type="radio" name="entrega" value="retiro" checked> Retiro en local</label>
            <label><input type="radio" name="entrega" value="envio"> Envío a domicilio</label>
        </div>

        <div class="cart-items" id="cart-items-container"></div>
        
        <div class="cart-footer">
            <div class="total-row">
                <span>Total:</span>
                <span id="cart-total">$0</span>
            </div>
            <button class="btn-wsp-enviar" id="btn-enviar-wsp">
                💬 Enviar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <!-- Carga del script como módulo para habilitar importaciones de Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
