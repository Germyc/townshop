<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petshop Huellitas - Estilo Bento Premium</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 20px 15px; }

        .bento-container {
            max-width: 480px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .hero-card {
            grid-column: span 2;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            padding: 30px 20px;
            border-radius: var(--radius);
            text-align: center;
        }
        .hero-card h1 { font-size: 28px; font-weight: 800; color: #0369a1; margin-bottom: 5px; }
        .hero-card p { color: #0c4a6e; font-size: 14px; }

        .img-card {
            grid-column: span 2;
            height: 200px;
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
        }
        .img-card img { width: 100%; height: 100%; object-fit: cover; }

        .info-box {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .info-box span { font-size: 24px; margin-bottom: 8px; }
        .info-box h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .info-box p { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

        .wsp-action {
            grid-column: span 2;
            background-color: #25d366;
            color: white;
            text-align: center;
            padding: 16px;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 15px -3px rgba(37,211,102,0.3);
        }
    </style>
</head>
<body>

    <div class="bento-container">
        <!-- Ficha Principal -->
        <header class="hero-card">
            <h1>Petshop Huellitas</h1>
            <p>El cuidado premium que tu mascota se merece</p>
        </header>

        <!-- Imagen de Portada -->
        <div class="img-card">
            <img src="https://images.unsplash.com/photo-1779896412071-bf3160aad19e" alt="Mascotas felices">
        </div>

        <!-- Bloque Izquierdo: Horarios -->
        <div class="info-box">
            <span>⏰</span>
            <h3>Horarios</h3>
            <p>Lun a Sáb<br>9:00 a 20:00 hs</p>
        </div>

        <!-- Bloque Derecho: Envíos -->
        <div class="info-box">
            <span>🛵</span>
            <h3>Envíos gratis</h3>
            <p>En compras de bolsas grandes dentro de la zona</p>
        </div>

        <!-- Bloque Completo: Dirección -->
        <div class="info-box" style="grid-column: span 2;">
            <h3>📍 Dónde estamos</h3>
            <p style="font-size: 14px; margin-top: 4px;">Av. Espora 3100, Adrogué</p>
        </div>

        <!-- Botón de Acción -->
        <a href="https://wa.me" class="wsp-action" target="_blank">
            💬 Hacer pedido por WhatsApp
        </a>
    </div>

</body>
</html>
